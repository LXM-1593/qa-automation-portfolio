name: UI Regression

# 触发策略见 docs/test-strategy.md 第 8 节：
# - push / PR 到 main：阻塞合并
# - 每周一定时：捕获演示站静默改版
# - 手动触发：发版前验证
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1" # 每周一 09:00 (UTC+8)

permissions:
  contents: read

concurrency:
  group: ui-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: Pytest + Selenium (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 纯文档提交可用 [skip ci] 跳过，避免无意义消耗
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show browser version
        run: google-chrome --version || chromium --version || true

      - name: Run UI regression
        env:
          HEADLESS: "1" # conftest.py 读取；CI 无显示器必须无头
          BASE_URL: https://www.saucedemo.com
        run: python -m pytest -q --durations=10

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report
          path: |
            reports/report.html
            reports/screenshots/
          if-no-files-found: ignore
          retention-days: 14
